version: 2

models:
  - name: dim_bank
    description: Une ligne par établissement financier normalisé.
    columns:
      - name: bank_sk
        data_tests:
          - unique
          - not_null
      - name: institution_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "banque"
                  - "banque participative"
                  - "banque centrale"
                  - transfert d\'argent
                  - "crédit à la consommation"
                  - "crédit immobilier"
                  - "microcrédit"
                  - "change"
                  - "assurance"
                  - "non identifié"
              config:
                store_failures: true
  - name: dim_region
    description: Une ligne par région, avec sa population RGPH 2024.
    columns:
      - name: region_iso
        data_tests:
          - unique
          - not_null
      - name: region_name
        data_tests:
          - not_null
      - name: population_2024
        data_tests:
          - not_null