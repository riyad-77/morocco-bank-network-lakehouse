name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: pip install ruff dbt-databricks==1.13.0

      - name: Analyser le code Python
        run: ruff check .

      - name: Valider le projet dbt
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci
        run: dbt parse